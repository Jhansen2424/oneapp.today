<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">D Zone ecommerce command center in the OneApp mobile PWA</title>
  <desc id="desc">A dark mobile dashboard showing order revenue, profit, orders, average order value, refunds, and channel mix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b20"/><stop offset="1" stop-color="#050718"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141a3a"/><stop offset="1" stop-color="#0c1028"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.label{font-size:10px;font-weight:700;letter-spacing:1.3px;fill:#94a3b8}.tiny{font-size:9px;font-weight:700;fill:#64748b}.body{font-size:12px;fill:#cbd5e1}.value{font-size:28px;font-weight:800;fill:white}.tileValue{font-size:19px;font-weight:800;fill:white}.tileLabel{font-size:9px;font-weight:800;letter-spacing:1px;fill:#94a3b8}.nav{font-size:8px;font-weight:700;fill:#64748b}.green{fill:#34d399}.blueText{fill:#60a5fa}
    </style>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <path d="M0 84H390" stroke="#1e2547"/>
  <g transform="translate(22 22)">
    <rect x="110" y="4" width="80" height="26" rx="13" fill="#10152f" stroke="#263052"/><text x="127" y="21" class="body" font-size="11">D Zone</text><text x="176" y="21" fill="#64748b">›</text>
    <circle cx="300" cy="17" r="17" fill="#10152f" stroke="#20294a"/><text x="294" y="22" fill="#60a5fa" font-size="18">✦</text>
    <circle cx="343" cy="17" r="17" fill="#10152f" stroke="#20294a"/><text x="337" y="22" fill="#94a3b8" font-size="15">●</text>
  </g>
  <text x="20" y="118" class="label">SUN, AUG 23  ·  D ZONE COMMERCE</text>
  <g transform="translate(20 138)">
    <rect width="350" height="68" rx="16" fill="url(#card)" stroke="#28447f"/>
    <circle cx="34" cy="34" r="20" fill="url(#blue)" filter="url(#glow)"/><text x="27" y="40" fill="white" font-size="20">✦</text>
    <text x="68" y="29" fill="white" font-size="14" font-weight="800">Ask OneApp anything</text>
    <text x="68" y="49" class="body">“Which products lost margin?”</text><text x="319" y="42" fill="#94a3b8" font-size="20">⌁</text>
  </g>
  <g transform="translate(20 220)">
    <rect width="40" height="25" rx="12" fill="#10152f"/><text x="9" y="17" class="tiny">Today</text>
    <rect x="46" width="32" height="25" rx="12" fill="#10152f"/><text x="56" y="17" class="tiny">7d</text>
    <rect x="84" width="40" height="25" rx="12" fill="url(#blue)"/><text x="94" y="17" fill="white" font-size="10" font-weight="800">30d</text>
    <rect x="130" width="38" height="25" rx="12" fill="#10152f"/><text x="140" y="17" class="tiny">60d</text>
    <rect x="174" width="38" height="25" rx="12" fill="#10152f"/><text x="184" y="17" class="tiny">90d</text>
    <rect x="231" width="119" height="25" rx="13" fill="#10152f" stroke="#20294a"/><rect x="286" y="2" width="62" height="21" rx="11" fill="url(#blue)"/><text x="242" y="17" class="tiny">SERVICE</text><text x="298" y="17" fill="white" font-size="9" font-weight="800">ECOMM</text>
  </g>
  <g transform="translate(20 257)"><rect width="171" height="27" rx="8" fill="#0b0f26" stroke="#20294a"/><text x="12" y="18" class="tiny">ALL CHANNELS  ▾</text><rect x="179" width="171" height="27" rx="8" fill="#0b0f26" stroke="#20294a"/><text x="191" y="18" class="tiny">ALL STORES  ▾</text></g>
  <g transform="translate(20 296)">
    <rect width="350" height="236" rx="18" fill="url(#card)" stroke="#263052"/>
    <rect x="276" y="17" width="54" height="18" rx="9" fill="#28200d"/><text x="288" y="29" fill="#fbbf24" font-size="8" font-weight="800">SAMPLE</text>
    <text x="20" y="35" fill="white" font-size="15" font-weight="800">Order Revenue</text><text x="20" y="52" class="tiny">Last 30 days vs prior</text>
    <text x="20" y="90" class="value">$42,180</text><text x="276" y="86" class="green" font-size="15" font-weight="800">+18.6%</text>
    <g transform="translate(20 108)"><rect width="28" height="22" rx="11" fill="#0d5d51"/><text x="10" y="15" fill="white" font-size="11" font-weight="800">$</text><text x="47" y="15" class="tiny">#</text><text x="73" y="15" class="tiny">BOTH</text></g>
    <path d="M20 199 C55 185 70 192 94 166 S142 177 165 145 S215 154 238 121 S279 139 330 84" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <path d="M20 199 C55 185 70 192 94 166 S142 177 165 145 S215 154 238 121 S279 139 330 84 V214 H20Z" fill="#3b82f6" opacity=".08"/>
    <path d="M20 214H330" stroke="#293251" stroke-dasharray="3 5"/>
  </g>
  <g transform="translate(20 545)">
    <g><rect width="168" height="103" rx="15" fill="url(#card)" stroke="#20294a"/><circle cx="27" cy="26" r="13" fill="#0d3b35"/><text x="22" y="31" class="green" font-size="14">$</text><text x="18" y="55" class="tileLabel">PROFIT</text><text x="18" y="80" class="tileValue">$9,240</text><text x="112" y="80" class="green" font-size="11" font-weight="800">+14.2%</text><text x="18" y="95" class="tiny">21.9% MARGIN</text></g>
    <g transform="translate(182 0)"><rect width="168" height="103" rx="15" fill="url(#card)" stroke="#20294a"/><circle cx="27" cy="26" r="13" fill="#102e59"/><text x="21" y="31" class="blueText" font-size="13">▣</text><text x="18" y="55" class="tileLabel">ORDERS</text><text x="18" y="80" class="tileValue">312</text><text x="122" y="80" class="green" font-size="11" font-weight="800">+24</text></g>
    <g transform="translate(0 115)"><rect width="168" height="103" rx="15" fill="url(#card)" stroke="#20294a"/><circle cx="27" cy="26" r="13" fill="#0d3541"/><text x="21" y="31" fill="#22d3ee" font-size="13">◎</text><text x="18" y="55" class="tileLabel">AOV</text><text x="18" y="80" class="tileValue">$135.18</text><text x="122" y="80" class="green" font-size="11" font-weight="800">+$8</text></g>
    <g transform="translate(182 115)"><rect width="168" height="103" rx="15" fill="url(#card)" stroke="#20294a"/><circle cx="27" cy="26" r="13" fill="#3b2c0e"/><text x="20" y="31" fill="#fbbf24" font-size="14">↻</text><text x="18" y="55" class="tileLabel">REFUNDS</text><text x="18" y="80" class="tileValue">2.1%</text><text x="116" y="80" class="green" font-size="11" font-weight="800">−0.3pt</text><text x="18" y="95" class="tiny">REFUND RATE</text></g>
  </g>
  <rect x="0" y="790" width="390" height="54" fill="#080b20" opacity=".98"/><path d="M0 790H390" stroke="#1e2547"/>
  <g transform="translate(22 805)"><text x="0" y="10" class="blueText" font-size="15">◆</text><text x="-5" y="28" class="nav blueText">HOME</text><text x="70" y="10" fill="#64748b" font-size="15">▣</text><text x="67" y="28" class="nav">INBOX</text><text x="138" y="10" fill="#64748b" font-size="15">◎</text><text x="135" y="28" class="nav">LEADS</text><text x="208" y="10" fill="#64748b" font-size="15">☑</text><text x="204" y="28" class="nav">TASKS</text><text x="276" y="10" fill="#64748b" font-size="15">▦</text><text x="270" y="28" class="nav">ORDERS</text><text x="344" y="10" fill="#64748b" font-size="15">•••</text><text x="340" y="28" class="nav">MORE</text></g>
</svg>
